<!--{"title":"Volunteer","description":"It takes a village. Volunteer with Living Learning Academy at meaningful, impactful events and help mentors pass on their skills.","path":"/volunteer/","scripts":["/assets/js/forms.js"]}-->

<section class="page-hero">
  <p class="eyebrow eyebrow--light">Volunteer</p>
  <h1>Share Your Time.</h1>
  <p>It takes a village. We need volunteers to help out at meaningful, impactful events and to assist mentors as they pass on their skills.</p>
</section>

<div class="form-shell">
  <!--#include form-switcher-->
  <form class="lla-form form-card" data-form-type="volunteer" novalidate>
    <!--#include form-top-->
    <!--#include contact-fields-->

    <fieldset class="form-section">
      <legend class="form-section__title">How would you like to help? <span class="req" aria-hidden="true">*</span></legend>
      <div class="choices" data-options="HELP_TYPES" data-name="help_types"></div>
      <p class="error" data-error-for="help_types" hidden></p>
      <fieldset class="field"><legend>When are you usually available? <span class="optional">(optional)</span></legend>
        <div class="choices" data-options="AVAILABILITY" data-name="availability"></div>
      </fieldset>
      <div class="field">
        <label for="about_you">Tell us about your skills or experience <span class="optional">(optional)</span></label>
        <textarea id="about_you" name="about_you" maxlength="2000"></textarea>
        <p class="error" data-error-for="about_you" hidden></p>
      </div>
    </fieldset>

    <!--#include consents-->
    <div class="form-actions"><button class="btn btn--gold btn--lg" type="submit">Submit <span aria-hidden="true">→</span></button></div>
    <a id="thanks-link" href="/join/thanks/" hidden>Thank you</a>
  </form>
</div>

<fieldset class="form-section consents">
  <legend class="form-section__title">Stay in the loop <span class="optional">(optional)</span></legend>
  <label class="choice"><input type="checkbox" name="notify_events"> Notify me about courses and events near me</label>
  <label class="choice"><input type="checkbox" name="updates_opt_in"> Send me LLA news and updates by email</label>
  <p class="hint">You can unsubscribe at any time.</p>
</fieldset>
<div class="field">
  <label class="choice"><input type="checkbox" name="privacy_consent" required> <span>I agree to LLA saving these details. <span class="req" aria-hidden="true">*</span></span></label>
  <p class="error" data-error-for="privacy_consent" hidden></p>
</div>
<p class="privacy-note">Please don’t include children’s names or health information. We use your answers only to contact you and to plan courses and events.</p>
